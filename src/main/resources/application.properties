spring.application.name=fly-away-travel
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flyaway}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# folder where flight_booking_email_<id>.txt files are written ("." = project root)
booking.email-dir=${BOOKING_EMAIL_DIR:.}
